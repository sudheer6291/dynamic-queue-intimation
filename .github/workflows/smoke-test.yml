name: Smoke test deployed app

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Deployed app base URL"
        required: false
        default: "https://dynamic-queue-intimation.vercel.app"

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: node tools/smoke-test-api.mjs "${{ github.event.inputs.base_url }}"

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: node tools/smoke-test-ui.mjs "${{ github.event.inputs.base_url }}"
